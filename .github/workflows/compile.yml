name: Compile sketch
run-name: Compile ${{ inputs.build_id }}

# Started by the web IDE (GitHub Pages) through the GitHub API; free compile backend.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Unique build id chosen by the IDE
        required: true
        type: string
      fqbn:
        description: Board FQBN, e.g. arduino:avr:uno
        required: true
        type: string
      sketch:
        description: gzip + base64 JSON {files:[{path,content}]}
        required: true
        type: string
      options:
        description: 'JSON: {"debug": bool, "urls": [extra Boards Manager URLs]}'
        required: false
        type: string
        default: '{}'

permissions:
  contents: write

env:
  ARDUINO_CLI_VERSION: 1.5.1
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            compile.js
            scripts/ci-compile.mjs

      - name: Pick core
        id: core
        env:
          FQBN: ${{ inputs.fqbn }}
          OPTIONS: ${{ inputs.options }}
        run: |
          if ! [[ "$FQBN" =~ ^([A-Za-z0-9_.-]+):([A-Za-z0-9_.-]+): ]]; then echo "Invalid FQBN"; exit 1; fi
          echo "platform=${BASH_REMATCH[1]}:${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          # Extra Boards Manager URLs for third-party boards (https only)
          URLS=$(node -e 'try { const o = JSON.parse(process.env.OPTIONS || "{}"); console.log((o.urls || []).filter(u => typeof u === "string" && u.startsWith("https://") && u.endsWith(".json") && !/[ ,"$`;]/.test(u)).join(",")) } catch { console.log("") }')
          echo "urls=${URLS:+$URLS,}$ESP32_INDEX" >> "$GITHUB_OUTPUT"

      # Core, libraries and the compiled-core cache are saved once per platform,
      # so later builds skip the download
      - name: Restore Arduino cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
            ~/Arduino/libraries
          key: arduino-${{ steps.core.outputs.platform }}-${{ env.ARDUINO_CLI_VERSION }}-v1

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh -s "$ARDUINO_CLI_VERSION" > /dev/null
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install core
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PLATFORM: ${{ steps.core.outputs.platform }}
          URLS: ${{ steps.core.outputs.urls }}
        run: |
          arduino-cli core update-index --additional-urls "$URLS"
          arduino-cli core install "$PLATFORM" --additional-urls "$URLS"
          arduino-cli lib update-index

      - name: Compile
        run: node scripts/ci-compile.mjs
        env:
          BUILD_ID: ${{ inputs.build_id }}
          FQBN: ${{ inputs.fqbn }}
          SKETCH: ${{ inputs.sketch }}
          OPTIONS: ${{ inputs.options }}
          # Allows libraries.txt entries that are git URLs or .zip links
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
